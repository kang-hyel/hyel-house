<style>:root{--wall:#1c2636;--wall2:#27364d;--desk:#e6ebf1;--paper:#eef1f5;--card:#ffffff;--tx:#1f2937;--mut:#586274;--ln:#d3dae3;--ac:#245f9e;--ok:#1f7a4d;--bad:#c0392b;--hi:#f1f5f9;--onac:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#0b111a;--wall2:#141d2b;--desk:#101722;--paper:#0c121b;--card:#182131;--tx:#e5eaf2;--mut:#9aa7ba;--ln:#2b394f;--ac:#6aa7e8;--ok:#4cc38a;--bad:#ef7d74;--hi:#1f2a3b;--onac:#0c121b;color-scheme:dark}}
:root[data-theme="dark"]{--wall:#0b111a;--wall2:#141d2b;--desk:#101722;--paper:#0c121b;--card:#182131;--tx:#e5eaf2;--mut:#9aa7ba;--ln:#2b394f;--ac:#6aa7e8;--ok:#4cc38a;--bad:#ef7d74;--hi:#1f2a3b;--onac:#0c121b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--tx);font:15px/1.55 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--wall2);z-index:10}
header{background:linear-gradient(var(--wall),var(--wall2));color:#eaf2ee;padding:14px 16px 0;position:relative}
header::after{content:"";position:absolute;right:16px;top:12px;width:54px;height:38px;border:3px solid #6f9a8f;border-radius:3px;background:linear-gradient(#9cc6e0 50%,#7fae92 50%);opacity:.55}
h1{margin:0;font-size:18px;font-weight:700}
.sub{font-size:13px;color:#b9d0c6;margin:2px 0 10px}
nav{display:flex;gap:4px;overflow-x:auto;margin:0 -4px}
nav button{flex:1 0 auto;border:0;background:transparent;color:#b9d0c6;padding:9px 12px;font:inherit;font-size:14px;border-radius:8px 8px 0 0;cursor:pointer}
nav button.on{background:var(--desk);color:#fff;font-weight:700}
main{background:var(--desk);padding:14px 12px 28px;min-height:70vh;background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.05) 46px 47px)}
.sheet{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:14px;max-width:680px;margin:0 auto 12px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sheet h2{margin:0 0 6px;font-size:16px}
p{margin:6px 0}.mut{color:var(--mut);font-size:13px}
.ev{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:6px;padding:10px 12px;margin-top:8px;font:inherit;cursor:pointer}
.ev:hover{background:var(--hi)}
.q{flex:0 0 28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;display:grid;place-items:center}
.q.ok{background:var(--ok)}.q.see{background:var(--mut)}
.ev b{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:5px;padding:7px 6px;min-width:0}
.row{display:grid;grid-template-columns:64px 1fr 110px 30px;gap:6px;margin-top:6px}
.row .x{border:0;background:transparent;color:var(--mut);font-size:18px;cursor:pointer}
.btn{border:0;border-radius:6px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--ac);color:#fff}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:400}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.tot{font-size:13px;color:var(--mut);margin-top:8px}
.fb{margin-top:12px;padding:10px 12px;border-radius:6px;border-left:4px solid var(--bad);background:var(--hi)}
.fb.ok{border-color:var(--ok)}
.fb li{margin:2px 0}
.fld{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;margin-top:8px}
.ans td:first-child{width:56px}
@media (max-width:420px){.row{grid-template-columns:58px 1fr 96px 24px}}
header,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body{display:flex;flex-direction:column;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper)}
main{flex:1;background:var(--desk);background-image:none}
h1,h2{font-weight:700}
header::after{display:none}
h1{font-size:19px;letter-spacing:0}
header{padding-bottom:0}
.sub{color:#9fb0c7}
nav{align-items:center;padding-bottom:8px}
nav button.on{background:var(--ac);color:var(--onac);border-radius:6px;padding:6px 12px;font-weight:700;flex:0 0 auto}
.rn{padding:6px 8px;font-size:15px;font-weight:700;color:#e8edf5}
.sheet{border:1px solid var(--ln);border-radius:8px;box-shadow:none}
.ev{border-radius:8px}
.btn{border-radius:6px;color:var(--onac);box-shadow:none}
.btn.g{color:var(--tx);border:1px solid var(--ln)}
.q{color:var(--onac)}
button:focus-visible,summary:focus-visible,canvas:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
main.map{padding-top:14px;padding-bottom:22px}
.hint{max-width:540px;margin:12px auto 0;text-align:center;font-size:13px;color:var(--mut)}
.dd{max-width:680px;margin:0 auto 10px;text-align:center;font-size:13px;color:var(--mut)}
details.qm{max-width:540px;margin:10px auto 0;color:var(--tx);font-size:13px}
details.qm summary{cursor:pointer;text-align:center;color:var(--mut)}
details.qm .bar{justify-content:center}
details.qm .btn{padding:7px 12px;font-size:13px}
.stage{max-width:540px;margin:0 auto;border:3px solid #1f2a3c;border-radius:6px;overflow:hidden;background:#1f2a3c;line-height:0}
#cv,.fcv{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{aspect-ratio:24/33;cursor:pointer}
.fcv{aspect-ratio:384/176;max-width:680px;margin:0 auto 12px;border-radius:6px}
.act{max-width:540px;margin:10px auto 0;display:flex;gap:10px;align-items:center;justify-content:center;min-height:38px;font-size:13px}
.pad{display:none;max-width:540px;margin:8px auto 0;justify-content:center;gap:8px}
.pad button{width:52px;height:44px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:6px;font-size:16px;touch-action:none}
@media (pointer:coarse){.pad{display:flex}}
.rbn{display:flex;gap:10px;align-items:baseline;padding:10px 14px}
.rbn b{font-size:17px}
.tbn{display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:680px;margin:0 auto 12px;padding:10px 14px}
.gbf{display:grid;gap:6px;margin:8px 0}
.gbi{padding:8px 0;border-bottom:1px solid var(--ln);display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.gbi .x{margin-left:auto;border:0;background:transparent;color:var(--mut);font-size:18px;cursor:pointer}
main.map .sheet{max-width:540px}
.tbn .btn,.rbn .btn{white-space:nowrap}
</style>

<script>
let coName='';try{coName=localStorage.getItem('sc_co')||''}catch(e){}
const coNm=()=>(coName||'').trim().slice(0,10)||'내 회사';
const W=n=>(Number(n)||0).toLocaleString('ko-KR');
const ACC=['현금','보통예금','카드매출미수금','배달앱미수금','선급금','부가세대급금','원재료','비품','시설장치','단기대여금','감가상각누계액','외상매입금','미지급금','예수금','부가세예수금','단기차입금','4대보험예수금','미지급비용','매장매출','배달매출','이자수익','원재료비','급여','복리후생비','임차료','수도광열비','배달수수료','카드수수료','소모품비','수선비','광고선전비','접대비','이자비용','잡손실','감가상각비','지급수수료','선납세금','미지급세금','법인세비용'];
const ASSET=['현금','보통예금','카드매출미수금','배달앱미수금','선급금','부가세대급금','원재료','비품','시설장치','단기대여금','선납세금'],LIAB=['외상매입금','미지급금','예수금','부가세예수금','단기차입금','4대보험예수금','미지급비용','미지급세금'],REVN=['매장매출','배달매출','이자수익'];
const OPEN={'현금':10000000,'보통예금':120000000,'자본금':-130000000};
const EV=[
{id:1,t:'본점 현금 매출 입금',d:'1월 2일 본점 홀 현금 매출 3,300,000원(부가세 포함)을 점장이 오늘 보통예금에 전액 입금했습니다. 세금계산서 발행 대상이 아닌 일반 매출입니다.',h:'포함된 금액을 1.1로 나누면 공급가액입니다. 차변은 실제로 늘어난 자산 하나뿐이에요.',a:[['D','보통예금',3300000],['C','매장매출',3000000],['C','부가세예수금',300000]]},
{id:2,t:'본점 카드 매출 집계',d:'같은 날 본점 카드 매출은 7,700,000원(부가세 포함)입니다. 카드사 입금은 아직 되지 않았습니다.',h:'아직 못 받은 돈은 보통예금이 아니라 받을 권리, 즉 미수금 계정입니다.',a:[['D','카드매출미수금',7700000],['C','매장매출',7000000],['C','부가세예수금',700000]]},
{id:3,t:'식자재 외상 매입',d:'식자재 업체에서 원재료 5,500,000원(부가세 포함)을 외상으로 들여오고 전자세금계산서를 받았습니다.',h:'매입 부가세는 비용이 아니라 나중에 돌려받을 세금입니다. 계정 이름에 대급금이 들어갑니다.',a:[['D','원재료',5000000],['D','부가세대급금',500000],['C','외상매입금',5500000]]},
{id:4,t:'배달앱 정산금 입금',d:'배달앱 미수금 5,000,000원이 정산되어 수수료 440,000원(공급가액 400,000원, 부가세 40,000원, 세금계산서 수취)을 뺀 4,560,000원이 보통예금에 입금되었습니다.',h:'미수금은 전액 줄어들어야 합니다. 수수료 공급가액은 비용, 부가세는 대급금으로 나눠요.',a:[['D','보통예금',4560000],['D','배달수수료',400000],['D','부가세대급금',40000],['C','배달앱미수금',5000000]]},
{id:5,t:'3호점 주방 설비 수리비',d:'3호점 주방 설비를 수리하고 880,000원(부가세 포함)을 보통예금에서 이체했습니다. 세금계산서를 받았고 수리는 수익적 지출입니다.',h:'수익적 지출은 자산이 아니라 바로 비용 처리합니다. 부가세는 따로 분리하세요.',a:[['D','수선비',800000],['D','부가세대급금',80000],['C','보통예금',880000]]},
{id:6,t:'아르바이트 급여 지급',d:'아르바이트 급여 2,000,000원을 지급했습니다. 3.3%(소득세 60,000원, 지방소득세 6,000원)를 원천징수하고 나머지를 보통예금에서 이체했습니다.',h:'떼어 둔 세금은 회사 돈이 아니라 대신 걷어 둔 돈이므로 부채 계정입니다. 급여는 총액으로 인식하세요.',a:[['D','급여',2000000],['C','예수금',66000],['C','보통예금',1934000]]},
{id:7,day:2,t:'식자재 외상대금 지급',d:'1월 2일에 들여온 식자재 외상대금 5,500,000원을 보통예금에서 이체했습니다.',h:'외상으로 샀던 빚을 갚는 거래입니다. 부가세는 이미 매입 때 처리했어요.',a:[['D','외상매입금',5500000],['C','보통예금',5500000]]},
{id:8,day:2,t:'2호점 임차료 지급',d:'2호점 월 임차료 3,300,000원(부가세 포함)을 보통예금에서 이체했고 전자세금계산서를 받았습니다.',h:'임차료는 공급가액만 비용이고 부가세는 대급금입니다.',a:[['D','임차료',3000000],['D','부가세대급금',300000],['C','보통예금',3300000]]},
{id:9,day:2,t:'카드사 매출 입금',d:'1월 2일 카드 매출 7,700,000원이 카드사 수수료 1%(77,000원, 부가세 없음)를 뺀 7,623,000원으로 보통예금에 입금되었습니다.',h:'미수금은 전액 없어지고, 못 받은 차액은 수수료 비용입니다.',a:[['D','보통예금',7623000],['D','카드수수료',77000],['C','카드매출미수금',7700000]]},
{id:10,day:3,t:'배달 매출 발생',d:'배달앱 주문 매출 4,400,000원(부가세 포함)이 발생했고 정산은 다음 주에 들어옵니다.',h:'정산 전이니 배달앱 미수금이 차변입니다. 매출과 부가세는 분리하세요.',a:[['D','배달앱미수금',4400000],['C','배달매출',4000000],['C','부가세예수금',400000]]},
{id:11,day:3,t:'전기요금 청구',d:'본점 전기요금 1,100,000원(부가세 포함) 청구서가 왔고 납부는 다음 달입니다. 세금계산서를 받았습니다.',h:'아직 돈을 안 냈으니 보통예금이 아니라 미지급 성격의 부채입니다.',a:[['D','수도광열비',1000000],['D','부가세대급금',100000],['C','미지급금',1100000]]},
{id:12,day:3,t:'홍보 전단 제작',d:'신메뉴 홍보 전단 제작비 330,000원(부가세 포함)을 현금으로 지급했고 세금계산서를 받았습니다.',h:'광고비 공급가액은 비용, 부가세는 대급금, 대변은 현금입니다.',a:[['D','광고선전비',300000],['D','부가세대급금',30000],['C','현금',330000]]},
{id:13,day:4,t:'은행 단기 대출 실행',d:'은행에서 단기차입금 24,000,000원을 연 6%(만기 1년)로 빌려 보통예금에 입금되었습니다.',h:'빌린 돈은 갚아야 하는 의무라 부채예요. 통장에 들어온 쪽은 자산이 늘어요.',a:[['D','보통예금',24000000],['C','단기차입금',24000000]]},
{id:14,day:5,t:'차입금 이자 지급',d:'이번 달 차입금 이자 120,000원(24,000,000원 x 6% ÷ 12)을 보통예금에서 이체했습니다.',h:'이자는 돈을 빌린 대가라 비용이에요. 원금은 그대로예요.',a:[['D','이자비용',120000],['C','보통예금',120000]]},
{id:15,day:5,t:'거래처 대여금 지급',d:'협력 농장에 운전자금으로 12,000,000원을 연 5%로 빌려주고 보통예금에서 이체했습니다.',h:'빌려준 돈은 돌려받을 권리, 즉 자산이에요.',a:[['D','단기대여금',12000000],['C','보통예금',12000000]]},

function ndTasks(){const d=S.day,E=EVD(),a=RQ.filter(r=>r.day<=d&&(r.day==d||!S.ap[r.id])),t=[{k:'inbox',n:'오늘의 사건함 전표',c:E.filter(e=>S.done[e.id]).length,m:E.length}];
if(a.length)t.push({k:'ap',n:'결재 품의 검토',c:a.filter(r=>S.ap[r.id]).length,m:a.length});
if(DC[d])t.push({k:'biz',n:'오늘의 경영 선택',c:S.dec[d]?1:0,m:1});
const X=(x,k,n)=>{const l=ALL().filter(e=>e.x==x&&(e.day||1)<=d&&((e.day||1)==d||!S.done[e.id]));if(l.length)t.push({k,n,c:l.filter(e=>S.done[e.id]).length,m:l.length})};
X('pay','tx','급여·4대보험 전표 (세무실)');X('close','rep','월말 결산 분개 (결산실)');
const TF=tfList().filter(f=>f.due<=d&&(f.due==d||!tfDone(f)));if(TF.length)t.push({k:'tx',n:'세무 신고·납부 (세무실)',c:TF.filter(tfDone).length,m:TF.length});
const CL=clList().filter(c=>c.due<=d&&(c.due==d||!clDone(c)));if(CL.length)t.push({k:'rep',n:'정기 결산서 (결산실)',c:CL.filter(clDone).length,m:CL.length});return t}
function ndDone(){return ndTasks().every(x=>x.c>=x.m)}
function ndBtn(){const ok=ndDone(),last=S.day>=MAXD,left=ndTasks().filter(x=>x.c<x.m).length;
return'<div id="ndw"><button id="ndb" class="'+(ok&&!last?'ready':'idle')+'" onclick="ndToggle()" aria-label="다음 날로 넘어가기">'+(last?'마지막 날':'다음 날 ▶')+(ok?'':'<i>'+left+'</i>')+'</button></div>'}
function ndPanel(){const t=ndTasks(),ok=t.every(x=>x.c>=x.m),last=S.day>=MAXD;
let h='<div class="sheet qsbox"><h2>'+dl(S.day)+' 하루 마무리</h2><p class="mut">'+(last?'준비된 하루는 여기까지예요. 다음 날은 이어서 추가할 수 있어요.':ok?'오늘 업무를 모두 마쳤어요. 다음 날로 넘어갈 수 있어요.':'오늘 업무를 모두 마쳐야 다음 날로 넘어갈 수 있어요.')+'</p>';
t.forEach(x=>{const d=x.c>=x.m,r=ROOMS.find(y=>y.k==x.k);h+='<div class="qsi'+(d?' dn':'')+'"><b>'+(d?'✓ ':'')+x.n+'</b> <span class="mut">'+x.c+'/'+x.m+'</span>'+(d||!r?'':'<div class="bar"><button class="btn g" onclick="ndGo(\''+x.k+'\')">'+r.n+'(으)로 가기</button></div>')+'</div>'});
return h+'<div class="bar">'+(ok&&!last?'<button class="btn" onclick="ndGoNext()">'+dl(S.day+1)+'(으)로 넘어가기</button>':'')+'<button class="btn g" onclick="ndToggle()">닫기</button></div></div>'}
function ndPaint(){['ndw','ndo'].forEach(k=>{const e=document.getElementById(k);if(e)e.remove()});
if(view!='map'||mode=='tour'){ndOpen=false;return}
const sg=$('#m').querySelector('.stage');if(sg)sg.insertAdjacentHTML('beforeend',ndBtn());
if(ndOpen){const o=document.createElement('div');o.id='ndo';o.onclick=e=>{if(e.target===o)ndToggle()};o.innerHTML=ndPanel();document.body.appendChild(o)}}
function ndToggle(){ndOpen=!ndOpen;ndPaint()}
function ndGo(k){ndOpen=false;ndPaint();if(!SOL)buildMap();const j=HOT.findIndex(h=>ROOMS[h.i].k==k);if(j>=0)openRoom(j)}
function ndGoNext(){if(!ndDone()||S.day>=MAXD)return;ndOpen=false;ndPaint();nextDay()}
window.addEventListener('keydown',e=>{if(e.key=='Escape'&&ndOpen){e.stopImmediatePropagation();ndToggle()}},true);
const ndRender0=render;render=function(){ndRender0();ndPaint()};
render();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}});
</script>
