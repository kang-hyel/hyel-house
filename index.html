<style>:root{--wall:#1c2636;--wall2:#27364d;--desk:#e6ebf1;--paper:#eef1f5;--card:#ffffff;--tx:#1f2937;--mut:#586274;--ln:#d3dae3;--ac:#245f9e;--ok:#1f7a4d;--bad:#c0392b;--hi:#f1f5f9;--onac:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#0b111a;--wall2:#141d2b;--desk:#101722;--paper:#0c121b;--card:#182131;--tx:#e5eaf2;--mut:#9aa7ba;--ln:#2b394f;--ac:#6aa7e8;--ok:#4cc38a;--bad:#ef7d74;--hi:#1f2a3b;--onac:#0c121b;color-scheme:dark}}
:root[data-theme="dark"]{--wall:#0b111a;--wall2:#141d2b;--desk:#101722;--paper:#0c121b;--card:#182131;--tx:#e5eaf2;--mut:#9aa7ba;--ln:#2b394f;--ac:#6aa7e8;--ok:#4cc38a;--bad:#ef7d74;--hi:#1f2a3b;--onac:#0c121b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--tx);font:15px/1.55 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--wall2);z-index:10}
header{background:linear-gradient(var(--wall),var(--wall2));color:#eaf2ee;padding:14px 16px 0;position:relative}
header::after{content:"";position:absolute;right:16px;top:12px;width:54px;height:38px;border:3px solid #6f9a8f;border-radius:3px;background:linear-gradient(#9cc6e0 50%,#7fae92 50%);opacity:.55}
h1{margin:0;font-size:18px;font-weight:700}
.sub{font-size:13px;color:#b9d0c6;margin:2px 0 10px}
nav{display:flex;gap:4px;overflow-x:auto;margin:0 -4px}
nav button{flex:1 0 auto;border:0;background:transparent;color:#b9d0c6;padding:9px 12px;font:inherit;font-size:14px;border-radius:8px 8px 0 0;cursor:pointer}
nav button.on{background:var(--desk);color:#fff;font-weight:700}
main{background:var(--desk);padding:14px 12px 28px;min-height:70vh;background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.05) 46px 47px)}
.sheet{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:14px;max-width:680px;margin:0 auto 12px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sheet h2{margin:0 0 6px;font-size:16px}
p{margin:6px 0}.mut{color:var(--mut);font-size:13px}
.ev{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:6px;padding:10px 12px;margin-top:8px;font:inherit;cursor:pointer}
.ev:hover{background:var(--hi)}
.q{flex:0 0 28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;display:grid;place-items:center}
.q.ok{background:var(--ok)}.q.see{background:var(--mut)}
.ev b{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:5px;padding:7px 6px;min-width:0}
.row{display:grid;grid-template-columns:64px 1fr 110px 30px;gap:6px;margin-top:6px}
.row .x{border:0;background:transparent;color:var(--mut);font-size:18px;cursor:pointer}
.btn{border:0;border-radius:6px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--ac);color:#fff}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:400}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.tot{font-size:13px;color:var(--mut);margin-top:8px}
.fb{margin-top:12px;padding:10px 12px;border-radius:6px;border-left:4px solid var(--bad);background:var(--hi)}
.fb.ok{border-color:var(--ok)}
.fb li{margin:2px 0}
.fld{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;margin-top:8px}
.ans td:first-child{width:56px}
@media (max-width:420px){.row{grid-template-columns:58px 1fr 96px 24px}}
header,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body{display:flex;flex-direction:column;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper)}
main{flex:1;background:var(--desk);background-image:none}
h1,h2{font-weight:700}
header::after{display:none}
h1{font-size:19px;letter-spacing:0}
header{padding-bottom:0}
.sub{color:#9fb0c7}
nav{align-items:center;padding-bottom:8px}
nav button.on{background:var(--ac);color:var(--onac);border-radius:6px;padding:6px 12px;font-weight:700;flex:0 0 auto}
.rn{padding:6px 8px;font-size:15px;font-weight:700;color:#e8edf5}
.sheet{border:1px solid var(--ln);border-radius:8px;box-shadow:none}
.ev{border-radius:8px}
.btn{border-radius:6px;color:var(--onac);box-shadow:none}
.btn.g{color:var(--tx);border:1px solid var(--ln)}
.q{color:var(--onac)}
button:focus-visible,summary:focus-visible,canvas:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
main.map{padding-top:14px;padding-bottom:22px}
.hint{max-width:540px;margin:12px auto 0;text-align:center;font-size:13px;color:var(--mut)}
.dd{max-width:680px;margin:0 auto 10px;text-align:center;font-size:13px;color:var(--mut)}
details.qm{max-width:540px;margin:10px auto 0;color:var(--tx);font-size:13px}
details.qm summary{cursor:pointer;text-align:center;color:var(--mut)}
details.qm .bar{justify-content:center}
details.qm .btn{padding:7px 12px;font-size:13px}
.stage{max-width:540px;margin:0 auto;border:3px solid #1f2a3c;border-radius:6px;overflow:hidden;background:#1f2a3c;line-height:0}
#cv,.fcv{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{aspect-ratio:24/33;cursor:pointer}
.fcv{aspect-ratio:384/176;max-width:680px;margin:0 auto 12px;border-radius:6px}
.act{max-width:540px;margin:10px auto 0;display:flex;gap:10px;align-items:center;justify-content:center;min-height:38px;font-size:13px}
.pad{display:none;max-width:540px;margin:8px auto 0;justify-content:center;gap:8px}
.pad button{width:52px;height:44px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:6px;font-size:16px;touch-action:none}
@media (pointer:coarse){.pad{display:flex}}
.rbn{display:flex;gap:10px;align-items:baseline;padding:10px 14px}
.rbn b{font-size:17px}
.tbn{display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:680px;margin:0 auto 12px;padding:10px 14px}
.gbf{display:grid;gap:6px;margin:8px 0}
.gbi{padding:8px 0;border-bottom:1px solid var(--ln);display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.gbi .x{margin-left:auto;border:0;background:transparent;color:var(--mut);font-size:18px;cursor:pointer}
main.map .sheet{max-width:540px}
.tbn .btn,.rbn .btn{white-space:nowrap}
</style>

<script>
let coName='';try{coName=localStorage.getItem('sc_co')||''}catch(e){}
const coNm=()=>(coName||'').trim().slice(0,10)||'내 회사';
const W=n=>(Number(n)||0).toLocaleString('ko-KR');
const ACC=['현금','보통예금','카드매출미수금','배달앱미수금','선급금','부가세대급금','원재료','비품','시설장치','단기대여금','감가상각누계액','외상매입금','미지급금','예수금','부가세예수금','단기차입금','4대보험예수금','미지급비용','매장매출','배달매출','이자수익','원재료비','급여','복리후생비','임차료','수도광열비','배달수수료','카드수수료','소모품비','수선비','광고선전비','접대비','이자비용','잡손실','감가상각비','지급수수료'];
const ASSET=['현금','보통예금','카드매출미수금','배달앱미수금','선급금','부가세대급금','원재료','비품','시설장치','단기대여금'],LIAB=['외상매입금','미지급금','예수금','부가세예수금','단기차입금','4대보험예수금','미지급비용'],REVN=['매장매출','배달매출','이자수익'];
const OPEN={'현금':10000000,'보통예금':120000000,'자본금':-130000000};
const EV=[
{id:1,t:'본점 현금 매출 입금',d:'1월 2일 본점 홀 현금 매출 3,300,000원(부가세 포함)을 점장이 오늘 보통예금에 전액 입금했습니다. 세금계산서 발행 대상이 아닌 일반 매출입니다.',h:'포함된 금액을 1.1로 나누면 공급가액입니다. 차변은 실제로 늘어난 자산 하나뿐이에요.',a:[['D','보통예금',3300000],['C','매장매출',3000000],['C','부가세예수금',300000]]},
{id:2,t:'본점 카드 매출 집계',d:'같은 날 본점 카드 매출은 7,700,000원(부가세 포함)입니다. 카드사 입금은 아직 되지 않았습니다.',h:'아직 못 받은 돈은 보통예금이 아니라 받을 권리, 즉 미수금 계정입니다.',a:[['D','카드매출미수금',7700000],['C','매장매출',7000000],['C','부가세예수금',700000]]},
{id:3,t:'식자재 외상 매입',d:'식자재 업체에서 원재료 5,500,000원(부가세 포함)을 외상으로 들여오고 전자세금계산서를 받았습니다.',h:'매입 부가세는 비용이 아니라 나중에 돌려받을 세금입니다. 계정 이름에 대급금이 들어갑니다.',a:[['D','원재료',5000000],['D','부가세대급금',500000],['C','외상매입금',5500000]]},
{id:4,t:'배달앱 정산금 입금',d:'배달앱 미수금 5,000,000원이 정산되어 수수료 440,000원(공급가액 400,000원, 부가세 40,000원, 세금계산서 수취)을 뺀 4,560,000원이 보통예금에 입금되었습니다.',h:'미수금은 전액 줄어들어야 합니다. 수수료 공급가액은 비용, 부가세는 대급금으로 나눠요.',a:[['D','보통예금',4560000],['D','배달수수료',400000],['D','부가세대급금',40000],['C','배달앱미수금',5000000]]},
{id:5,t:'3호점 주방 설비 수리비',d:'3호점 주방 설비를 수리하고 880,000원(부가세 포함)을 보통예금에서 이체했습니다. 세금계산서를 받았고 수리는 수익적 지출입니다.',h:'수익적 지출은 자산이 아니라 바로 비용 처리합니다. 부가세는 따로 분리하세요.',a:[['D','수선비',800000],['D','부가세대급금',80000],['C','보통예금',880000]]},
{id:6,t:'아르바이트 급여 지급',d:'아르바이트 급여 2,000,000원을 지급했습니다. 3.3%(소득세 60,000원, 지방소득세 6,000원)를 원천징수하고 나머지를 보통예금에서 이체했습니다.',h:'떼어 둔 세금은 회사 돈이 아니라 대신 걷어 둔 돈이므로 부채 계정입니다. 급여는 총액으로 인식하세요.',a:[['D','급여',2000000],['C','예수금',66000],['C','보통예금',1934000]]},
{id:7,day:2,t:'식자재 외상대금 지급',d:'1월 2일에 들여온 식자재 외상대금 5,500,000원을 보통예금에서 이체했습니다.',h:'외상으로 샀던 빚을 갚는 거래입니다. 부가세는 이미 매입 때 처리했어요.',a:[['D','외상매입금',5500000],['C','보통예금',5500000]]},
{id:8,day:2,t:'2호점 임차료 지급',d:'2호점 월 임차료 3,300,000원(부가세 포함)을 보통예금에서 이체했고 전자세금계산서를 받았습니다.',h:'임차료는 공급가액만 비용이고 부가세는 대급금입니다.',a:[['D','임차료',3000000],['D','부가세대급금',300000],['C','보통예금',3300000]]},
{id:9,day:2,t:'카드사 매출 입금',d:'1월 2일 카드 매출 7,700,000원이 카드사 수수료 1%(77,000원, 부가세 없음)를 뺀 7,623,000원으로 보통예금에 입금되었습니다.',h:'미수금은 전액 없어지고, 못 받은 차액은 수수료 비용입니다.',a:[['D','보통예금',7623000],['D','카드수수료',77000],['C','카드매출미수금',7700000]]},
{id:10,day:3,t:'배달 매출 발생',d:'배달앱 주문 매출 4,400,000원(부가세 포함)이 발생했고 정산은 다음 주에 들어옵니다.',h:'정산 전이니 배달앱 미수금이 차변입니다. 매출과 부가세는 분리하세요.',a:[['D','배달앱미수금',4400000],['C','배달매출',4000000],['C','부가세예수금',400000]]},
{id:11,day:3,t:'전기요금 청구',d:'본점 전기요금 1,100,000원(부가세 포함) 청구서가 왔고 납부는 다음 달입니다. 세금계산서를 받았습니다.',h:'아직 돈을 안 냈으니 보통예금이 아니라 미지급 성격의 부채입니다.',a:[['D','수도광열비',1000000],['D','부가세대급금',100000],['C','미지급금',1100000]]},
{id:12,day:3,t:'홍보 전단 제작',d:'신메뉴 홍보 전단 제작비 330,000원(부가세 포함)을 현금으로 지급했고 세금계산서를 받았습니다.',h:'광고비 공급가액은 비용, 부가세는 대급금, 대변은 현금입니다.',a:[['D','광고선전비',300000],['D','부가세대급금',30000],['C','현금',330000]]},
{id:13,day:4,t:'은행 단기 대출 실행',d:'은행에서 단기차입금 24,000,000원을 연 6%(만기 1년)로 빌려 보통예금에 입금되었습니다.',h:'빌린 돈은 갚아야 하는 의무라 부채예요. 통장에 들어온 쪽은 자산이 늘어요.',a:[['D','보통예금',24000000],['C','단기차입금',24000000]]},
{id:14,day:5,t:'차입금 이자 지급',d:'이번 달 차입금 이자 120,000원(24,000,000원 x 6% ÷ 12)을 보통예금에서 이체했습니다.',h:'이자는 돈을 빌린 대가라 비용이에요. 원금은 그대로예요.',a:[['D','이자비용',120000],['C','보통예금',120000]]},
{id:15,day:5,t:'거래처 대여금 지급',d:'협력 농장에 운전자금으로 12,000,000원을 연 5%로 빌려주고 보통예금에서 이체했습니다.',h:'빌려준 돈은 돌려받을 권리, 즉 자산이에요.',a:[['D','단기대여금',12000000],['C','보통예금',12000000]]},

#qsb i{position:absolute;right:-6px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font:700 11px/18px sans-serif;font-style:normal;text-align:center;padding:0 4px}
#qsl{background:rgba(17,24,39,.88);color:#fff;border-radius:6px;padding:5px 9px;max-width:230px}
@keyframes qsPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){#qsb.new{animation:none}}
#qsp{max-width:540px;margin:10px auto 0}
main.room #qsp{max-width:680px;margin:0 auto 12px}
#qsp.qsov{position:fixed;inset:0;z-index:60;max-width:none;margin:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#qsp .qsbox{background:#fff;color:#1f2937;opacity:1;width:100%;max-width:520px;max-height:85vh;overflow:auto;margin:0;border:2px solid #1f2a3c;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#qsp .qsi{background:#f8fafc}
#qsl{background:#111827;color:#fff;border:2px solid #fbbf24;border-radius:8px;padding:8px 12px;max-width:280px;font-size:14px;font-weight:700;line-height:1.35;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.qsi{border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin-top:8px;background:var(--card)}
.qsi.dn{border-left:4px solid var(--ok)}
.qst{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:6px;background:var(--ac);color:var(--onac)}
.qst.sug{background:#b7791f;color:#fff}.qst.fb{background:var(--mut);color:#fff}
.qsi .bar{margin-top:8px}.qsi .btn{padding:7px 12px;font-size:13px}
</style>

<script>
/* ===== 퀘스트: 상사·동료의 업무 요청, 제안, 피드백 ===== */
let qsOpen=false,qsNext=0,qsFlash=null;
const qsTY={req:'업무 요청',sug:'제안',fb:'피드백'};
const qsSt=()=>{if(!S.qs)S.qs={};return S.qs};
const qsOffice=()=>view!='town'&&view!='cafe'&&view!='gate'&&view!='start';
const qsNum=ks=>ks.every(k=>S.nq&&S.nq[k]&&S.nq[k].ok);
function qsDefs(){const d=S.day,tr=Object.keys(S.tries||{}).length,
fi=ALL().filter(e=>S.done[e.id]&&S.done[e.id].ok&&!(S.tries&&S.tries[e.id])).length,
apBad=()=>RQ.some(r=>S.ap[r.id]&&!S.ap[r.id].ok),
apNew=()=>RQ.some(r=>r.day<=d&&!S.ap[r.id]),
cl=[31,32,33];
return[
{id:'inbox-'+d,ty:'req',from:'김 팀장 (상사)',t:'오늘 전표 마감',m:'오늘 사건함에 올라온 전표를 퇴근 전까지 모두 처리해 주세요. 막히면 힌트를 보고, 그래도 어려우면 정답을 확인한 뒤 자료실에서 복습하세요.',go:'inbox',on:()=>EVD().some(e=>!S.done[e.id]),ok:()=>EVD().every(e=>S.done[e.id]),r:'오늘 전표가 모두 마감됐네요. 수고했어요.'},
{id:'ap-'+d,ty:'req',from:'이 대리 (동료)',t:'결제 품의 검토',m:'구매팀에서 결제 품의가 올라왔어요. 증빙을 확인하고 승인, 보류, 반려 중 하나로 결정해 주세요.',go:'ap',on:apNew,ok:()=>!apNew(),r:'품의 검토 고마워요. 구매팀에 결과 전달할게요.'},
{id:'biz-'+d,ty:'sug',from:'대표',t:'오늘의 경영 선택',m:'경제 뉴스 예보를 보고 오늘 안건을 골라 주세요. 회계 담당자 의견이 궁금해요.',go:'biz',on:()=>!!DC[d]&&!S.dec[d],ok:()=>!!S.dec[d],r:'의견 잘 받았어요. 결과는 2일 뒤 정산되면 같이 봅시다.'},
{id:'fb-good',ty:'fb',from:'김 팀장 (상사)',t:'전표 정확도 칭찬',m:'전표 '+fi+'건을 한 번에 맞혔네요. 차변·대변 구분이 안정적이에요. 이 속도로 가면 결산도 맡길 수 있겠어요.',on:()=>fi>=3},
{id:'fb-try',ty:'fb',from:'김 팀장 (상사)',t:'전표 재입력 건 복습',m:'다시 입력한 전표가 '+tr+'건 있었어요. 틀린 건 괜찮지만 같은 실수가 반복되지 않게 자료실의 복습할 항목을 한 번 훑어보세요.',go:'rec',on:()=>tr>0},
{id:'ap-redo',ty:'req',from:'이 대리 (동료)',t:'품의 결정 재검토',m:'아까 결정한 품의 중에 다시 봐야 할 건이 있어요. 결재실에서 해당 건을 다시 검토해 주세요.',go:'ap',on:apBad,ok:()=>!apBad(),r:'재검토까지 깔끔하게 끝났어요.'},
{id:'pay',ty:'req',from:'최 과장 (세무)',t:'급여·4대보험 계산',m:'정규직 급여 지급 전에 4대보험과 실수령액 계산 세 문제를 검산해 주세요. 세무실에 있어요.',go:'tx',on:()=>d>=2,ok:()=>qsNum(['p1','p2','p3']),r:'계산이 맞아요. 이 숫자로 급여 전표를 입력하면 돼요.'},
{id:'bank',ty:'req',from:'박 주임 (자금)',t:'은행 잔액 대사',m:'장부 보통예금 잔액과 은행 잔고증명서 금액이 달라요. 자금팀에서 차이 원인을 찾아 맞춰 주세요.',go:'fund',on:()=>d>=2,ok:()=>!!(S.bk&&S.bk.done),r:'대사 끝났네요. 수수료와 이자가 장부에 반영됐어요.'},
{id:'htx',ty:'req',from:'최 과장 (세무)',t:'홈택스 대사 차이 정리',m:'홈택스 매입 세금계산서와 장부 매입세액이 50,000원 차이 나요. 세무실에서 누락 전표를 추가하고 입력해 주세요.',go:'tx',on:()=>d>=2&&!S.done[201],ok:()=>!!S.done[201],r:'누락분이 장부에 들어갔어요. 이제 대사 차이가 없어요.'},
{id:'txsub',ty:'req',from:'김 팀장 (상사)',t:'세무 신고서 제출',m:'홈택스 대사와 검토 업무를 끝내고 세무실에서 신고서를 제출해 주세요.',go:'tx',on:()=>d>=3,ok:()=>!!S.tx,r:'신고서 접수 확인했어요.'},
{id:'loan',ty:'sug',from:'박 주임 (자금)',t:'이자 계산 맞춰 보기',m:'차입금과 대여금 이자를 제가 계산한 값과 맞춰 보고 싶어요. 자금팀의 이자 계산 세 문제를 풀어 주실래요?',go:'fund',on:()=>d>=4,ok:()=>qsNum(['i1','i2','i3']),r:'제 계산과 같아요. 덕분에 확신이 생겼어요.'},
{id:'close',ty:'req',from:'김 팀장 (상사)',t:'월말 결산 분개',m:'월말이에요. 결산실에서 감가상각, 원재료비 대체, 미지급 이자 분개를 입력해 주세요.',go:'rep',on:()=>d>=6,ok:()=>cl.every(k=>S.done[k]),r:'결산 조정이 끝났어요. 손익계산서를 확인해 보세요.'}
]}
function qsCheck(){const st=qsSt(),df={};qsDefs().forEach(x=>df[x.id]=x);let ch=false;
Object.keys(st).forEach(id=>{const q=st[id];if(q.st!='new'&&q.st!='acc')return;const x=df[id];
if(!x){q.st='exp';ch=true}
else if(x.ok&&x.ok()){q.st='done';q.at=Date.now();q.f=x.from;q.t=x.t;q.r=x.r;qsFlash={u:Date.now()+7000,s:'완료 · '+x.t};ch=true}});
if(ch&&mode!='tour')save();return ch}
function qsIssue(){if(mode=='tour'||!qsOffice())return false;const now=Date.now();if(!qsNext){qsNext=now+6000;return false}if(now<qsNext)return false;
const st=qsSt();if(Object.keys(st).filter(id=>st[id].st=='new'||st[id].st=='acc').length>=2){qsNext=now+15000;return false}
const x=qsDefs().find(x=>!st[x.id]&&x.on()&&!(x.ok&&x.ok()));
if(!x){qsNext=now+10000;return false}
st[x.id]={st:'new',d:S.day};qsNext=now+30000+Math.floor(Math.random()*30000);qsFlash={u:now+10000,s:x.from+' · '+qsTY[x.ty]+': '+x.t};save();return true}
function qsBtn(){const st=qsSt(),op=Object.keys(st).filter(id=>st[id].st=='new'||st[id].st=='acc'),nw=op.filter(id=>st[id].st=='new').length,fl=qsFlash&&qsFlash.u>Date.now()&&!qsOpen;
return'<div id="qsw"><button id="qsb" class="'+(nw?'new':op.length?'':'idle')+'" onclick="qsToggle()" aria-label="업무 요청 '+op.length+'건">?'+(op.length?'<i>'+op.length+'</i>':'')+'</button>'+(fl?'<span id="qsl" onclick="qsToggle()">'+qsFlash.s+'</span>':'')+'</div>'}
function qsPanel(){const st=qsSt(),df={};qsDefs().forEach(x=>df[x.id]=x);
const op=Object.keys(st).filter(id=>(st[id].st=='new'||st[id].st=='acc')&&df[id]),dn=Object.keys(st).filter(id=>st[id].st=='done').sort((a,b)=>(st[b].at||0)-(st[a].at||0));
let h='<div id="qsp" class="qsov" onclick="if(event.target===this)qsToggle()"><div class="sheet qsbox"><h2>받은 요청</h2><p class="mut">상사와 동료가 가끔 요청, 제안, 피드백을 보내요. 진행 중 '+op.length+'건 · 요청을 두 번 누르면 해당 방으로 바로 가요.</p>';
if(!op.length)h+='<p class="mut">지금은 새 요청이 없어요. 일하다 보면 ?가 다시 떠요.</p>';
op.forEach(id=>{const x=df[id],q=st[id];
h+='<div class="qsi"'+(x.go?' ondblclick="qsGo(\''+id+'\')" title="두 번 누르면 해당 방으로 이동"':'')+'><span class="qst '+x.ty+'">'+qsTY[x.ty]+'</span><b>'+x.t+'</b><p class="mut">'+x.from+(q.st=='acc'?' · 진행 중':'')+'</p><p>'+x.m+'</p><div class="bar">'
+(x.ty=='fb'?'<button class="btn" onclick="qsAck(\''+id+'\')">확인했어요</button>':q.st=='new'?'<button class="btn" onclick="qsAcc(\''+id+'\')">수락</button>':'')
+(x.go?'<button class="btn g" onclick="qsGo(\''+id+'\')">'+ROOMS.find(r=>r.k==x.go).n+'(으)로 가기</button>':'')
+(x.ty=='sug'?'<button class="btn g" onclick="qsSkip(\''+id+'\')">이번엔 넘길게요</button>':'')+'</div></div>'});
return h+'<div class="bar"><button class="btn g" onclick="qsToggle()">닫기</button></div></div></div>'}
function qsPaint(){['qsw','qsp'].forEach(k=>{const e=document.getElementById(k);if(e){const p=e.parentNode;p.removeChild(e);if(p.className=='qsr')p.parentNode.removeChild(p)}});
if(!qsOffice()||mode=='tour')return;const m=$('#m'),sg=view=='map'?m.querySelector('.stage'):null;
if(sg){sg.insertAdjacentHTML('beforeend',qsBtn());if(qsOpen)sg.insertAdjacentHTML('afterend',qsPanel())}
else m.insertAdjacentHTML('afterbegin','<div class="qsr">'+qsBtn()+'</div>'+(qsOpen?qsPanel():''))}
function qsToggle(){qsOpen=!qsOpen;qsPaint()}
function qsAcc(id){const q=qsSt()[id];if(q&&q.st=='new'){q.st='acc';save()}qsPaint()}
function qsAck(id){const q=qsSt()[id],x=qsDefs().find(y=>y.id==id);if(q){q.st='done';q.at=Date.now();if(x){q.f=x.from;q.t=x.t;q.r=x.m}save()}qsPaint()}
function qsSkip(id){const q=qsSt()[id];if(q){q.st='skip';save()}qsPaint()}
function qsGo(id){const q=qsSt()[id],x=qsDefs().find(y=>y.id==id);if(!x||!x.go)return;if(q&&q.st=='new'){q.st='acc';save()}qsOpen=false;
if(!SOL)buildMap();const j=HOT.findIndex(h=>ROOMS[h.i].k==x.go);if(j>=0)openRoom(j)}
const qsRender0=render;
render=function(){qsRender0();if(qsOffice()){qsCheck();qsIssue()}else qsOpen=false;if(gbOpen&&view!=gbRoom)gbClose();qsPaint()};
setInterval(()=>{if(!qsOffice()||mode=='tour')return;const a=qsCheck(),b=qsIssue(),c=qsFlash&&qsFlash.u<=Date.now();if(c)qsFlash=null;if(a||b||c)qsPaint()},3000);
document.addEventListener('keydown',e=>{const t=e.target&&e.target.tagName;if(t=='INPUT'||t=='TEXTAREA'||t=='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;if(view=='map'&&e.key.toLowerCase()=='q'){e.preventDefault();qsToggle()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&qsOpen)qsToggle()});
/* 더블클릭·더블탭: 해당 장소로 바로 이동 */
let dtT=0,dtX=0,dtY=0;
function dtHit(ev){const el=ev.target,id=el&&el.id;if(!id)return false;
if(id=='cv'&&view=='map'){const r=el.getBoundingClientRect(),tx=Math.floor((ev.clientX-r.left)/r.width*TW),ty=Math.floor((ev.clientY-r.top)/r.height*TH);
if(tx>=10&&tx<=13&&ty>=31){goCafe(1);return true}
let j=-1;HOT.forEach((h,k)=>{if(Math.abs(h.tx-tx)<=1&&Math.abs(h.ty-ty)<=1)j=k});if(j>=0){openRoom(j);return true}return false}
if(id=='cfv'&&view=='cafe'){if(cfSit!=null)return false;const r=el.getBoundingClientRect(),tx=Math.floor((ev.clientX-r.left)/r.width*CF_W),ty=Math.floor((ev.clientY-r.top)/r.height*CF_H);
let j=-1;cfHot.forEach((h,k)=>{if(tx>=h.x0&&tx<=h.x1&&ty>=h.y0&&ty<=h.y1)j=k});if(j>=0){cfUse(j);return true}return false}
if(id=='tv'&&view=='town'){const r=el.getBoundingClientRect(),tx=Math.floor((ev.clientX-r.left)/r.width*TN_W),ty=Math.floor((ev.clientY-r.top)/r.height*TN_H);
let j=-1;tnHot.forEach((h,k)=>{if(tx>=h.x0&&tx<=h.x1&&ty>=h.y0&&ty<=h.y1)j=k});if(j>=0){tnUse(j);return true}return false}
return false}
window.addEventListener('pointerdown',e=>{const now=Date.now();if(now-dtT<380&&Math.hypot(e.clientX-dtX,e.clientY-dtY)<30){dtT=0;if(dtHit(e)){e.stopPropagation();e.preventDefault()}return}dtT=now;dtX=e.clientX;dtY=e.clientY},true);
render();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}});
</script>
